# =====================================================================
#  EcoWaste - Pipeline CI/CD (GitHub Actions)
#
#  build  ->  test  ->  docker-image  ->  deploy-staging  ->  deploy-production
#
#  - Pull Request ............ build + test (validação)
#  - Push em develop ......... build + test + imagem + deploy STAGING
#  - Push em main ............ tudo acima + deploy PRODUÇÃO
#  - Execução manual ......... "Run workflow" na aba Actions
# =====================================================================
name: CI/CD EcoWaste

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # bash com -eo pipefail: falha se qualquer comando do pipe falhar

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # -------------------------------------------------------------------
  # 1) BUILD: restaura dependências e compila a solução em Release
  # -------------------------------------------------------------------
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore EcoWaste.sln

      - name: Compilar (Release)
        run: dotnet build EcoWaste.sln -c Release --no-restore 2>&1 | tee build.log

      - name: Publicar artefato da API
        run: dotnet publish src/EcoWaste.Api/EcoWaste.Api.csproj -c Release --no-build -o out/api

      - name: Upload do artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: ecowaste-api-build
          path: |
            out/api
            build.log
          retention-days: 7

  # -------------------------------------------------------------------
  # 2) TESTES: executa os testes xUnit (banco InMemory)
  # -------------------------------------------------------------------
  test:
    name: 2. Testes automatizados
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Executar testes xUnit
        run: |
          set -o pipefail
          dotnet test EcoWaste.sln -c Release \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults 2>&1 | tee TestResults-console.log

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "## Testes automatizados"
            echo '```'
            grep -E "Passed!|Failed!|Total tests|Aprovado|Com falha" TestResults-console.log || tail -n 20 TestResults-console.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dos resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            TestResults-console.log

  # -------------------------------------------------------------------
  # 3) IMAGEM DOCKER: build pelo Dockerfile e push no GitHub Container Registry
  # -------------------------------------------------------------------
  docker-image:
    name: 3. Build e push da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (GHCR exige minúsculas)
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER}/ecowaste-api:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ env.REGISTRY }}/${OWNER}/ecowaste-api:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo da imagem
        run: |
          docker pull "${{ steps.vars.outputs.image }}"
          {
            echo "## Imagem Docker publicada"
            echo "- Imagem: \`${{ steps.vars.outputs.image }}\`"
            echo '```'
            docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | grep ecowaste-api
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # 4) DEPLOY STAGING (homologação) - develop e main
  # -------------------------------------------------------------------
  deploy-staging:
    name: 4. Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-image
    environment:
      name: staging
      url: http://localhost:8081/swagger
    env:
      ORACLE_PASSWORD: ${{ secrets.STAGING_ORACLE_PASSWORD }}
      DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir ambiente staging (docker compose)
        run: ./scripts/deploy.sh staging "${{ needs.docker-image.outputs.image }}" 2>&1 | tee deploy-staging.log

      - name: Smoke tests no staging
        run: ./scripts/smoke-test.sh http://localhost:8081 2>&1 | tee smoke-staging.log

      - name: Coletar evidências
        if: always()
        run: |
          mkdir -p evidencias
          cp deploy-staging.log smoke-staging.log evidencias/ 2>/dev/null || true
          curl -s http://localhost:8081/health | jq . > evidencias/health-staging.json || true
          docker ps -a --filter "name=ecowaste-staging" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' > evidencias/containers-staging.txt || true
          docker logs ecowaste-staging-api > evidencias/logs-api-staging.txt 2>&1 || true
          docker logs ecowaste-staging-db > evidencias/logs-db-staging.txt 2>&1 || true
          {
            echo "## Deploy STAGING"
            echo '```json'
            cat evidencias/health-staging.json
            echo '```'
            echo '```'
            cat evidencias/containers-staging.txt
            echo '```'
            echo '```'
            cat smoke-staging.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload das evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-staging
          path: evidencias

  # -------------------------------------------------------------------
  # 5) DEPLOY PRODUÇÃO - somente na branch main, após staging OK
  #    (Para aprovação manual: Settings > Environments > production >
  #     Required reviewers)
  # -------------------------------------------------------------------
  deploy-production:
    name: 5. Deploy Produção
    runs-on: ubuntu-latest
    needs: [docker-image, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://localhost:8080/swagger
    env:
      ORACLE_PASSWORD: ${{ secrets.PROD_ORACLE_PASSWORD }}
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir ambiente de produção (docker compose)
        run: ./scripts/deploy.sh production "${{ needs.docker-image.outputs.image }}" 2>&1 | tee deploy-production.log

      - name: Smoke tests em produção
        run: ./scripts/smoke-test.sh http://localhost:8080 2>&1 | tee smoke-production.log

      - name: Coletar evidências
        if: always()
        run: |
          mkdir -p evidencias
          cp deploy-production.log smoke-production.log evidencias/ 2>/dev/null || true
          curl -s http://localhost:8080/health | jq . > evidencias/health-production.json || true
          docker ps -a --filter "name=ecowaste-production" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' > evidencias/containers-production.txt || true
          docker logs ecowaste-production-api > evidencias/logs-api-production.txt 2>&1 || true
          docker logs ecowaste-production-db > evidencias/logs-db-production.txt 2>&1 || true
          {
            echo "## Deploy PRODUÇÃO"
            echo '```json'
            cat evidencias/health-production.json
            echo '```'
            echo '```'
            cat evidencias/containers-production.txt
            echo '```'
            echo '```'
            cat smoke-production.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload das evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-production
          path: evidencias
